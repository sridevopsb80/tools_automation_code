# setup vault via build server using ansible
name: Run Vault Setup
on: [workflow_dispatch] # manual trigger
jobs:
  Provision:
    runs-on: self-hosted # build server
    steps:
      - uses: actions/checkout@v4 # get the code
      - run: echo $PATH
      - name: Run Vault Setup
        run: ansible-playbook -i vault-internal.sridevops.site, \
          tool-setup.yml -e ansible_user=${{ secrets.SSH_USER }} \
          -e ansible_password=${{ secrets.SSH_PWD }} \
          -e tool_name=vault
        #defining and using github organization secrets from actions for better security